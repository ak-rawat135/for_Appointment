<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>akrawat has created this </title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    background:#090909;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow-x:hidden;
    position:relative;
}

/* Purple particles glow */

body::before{
    content:'';
    position:absolute;
    inset:0;

    background:
    radial-gradient(circle at left,
    rgba(140,82,255,.35),
    transparent 40%),

    radial-gradient(circle at right,
    rgba(255,170,0,.25),
    transparent 40%);

    z-index:0;
}

/* Left Character */

.left-side{
    position:fixed;
    left:0;
    top:0;

    width:30%;
    height:100%;

background-image: url("file:///C:/Users/anike/OneDrive/Pictures/Screenshots/toji-image.png");    background-size:cover;
    background-position:center;
}

/* Right Character */

.right-side{
    position:fixed;
    right:0;
    top:0;

    width:30%;
    height:100%;

    background-image: url("file:///C:/Users/anike/OneDrive/Pictures/Screenshots/zen.png");
    background-size:cover;
    background-position:center;
}

.container{

    position:relative;
    z-index:10;

    width:750px;

    background:rgba(0,0,0,.82);

    backdrop-filter:blur(12px);

    border-radius:24px;

    padding:35px;

    border:1px solid #9d4edd;

    box-shadow:
    0 0 20px #7b2cbf,
    0 0 50px rgba(123,44,191,.4);
}

.icon{
    text-align:center;
    color:#c77dff;
    font-size:50px;
}

h1{
    text-align:center;
    color:white;
    margin-top:15px;
    font-size:52px;
}

h1 span{
    color:#c77dff;
}

.subtitle{
    text-align:center;
    color:#bbb;
    margin-top:10px;
    margin-bottom:30px;
}

label{
    display:block;
    color:white;
    margin-bottom:8px;
    margin-top:15px;
    font-size:18px;
}

label i{
    color:#c77dff;
    margin-right:8px;
}

input{
    width:100%;
    padding:15px;
    border-radius:12px;

    border:1px solid #6f2dbd;

    background:#111;
    color:white;

    font-size:16px;
}

input:focus{
    outline:none;

    box-shadow:
    0 0 10px #c77dff;
}

button{
    width:100%;
    margin-top:25px;

    padding:16px;

    border:none;

    border-radius:12px;

    color:white;

    font-size:18px;
    font-weight:600;

    cursor:pointer;

    background:
    linear-gradient(
        90deg,
        #7b2cbf,
        #c77dff,
        #d946ef
    );
}

button:hover{
    transform:translateY(-2px);
}

.appointments-title{
    color:white;
    font-size:28px;
    margin-top:35px;
    margin-bottom:20px;
}

#appointments{
    list-style:none;
}

#appointments li{
    background:#151515;

    border-left:4px solid #c77dff;

    margin-bottom:12px;

    padding:15px;

    border-radius:12px;

    color:white;

    display:flex;
    justify-content:space-between;
    align-items:center;
}
</style>
</head>

<body>

<div class="left-side"></div>
<div class="right-side"></div>

<div class="container">

    <div class="icon">
        <i class="fa-solid fa-calendar-check"></i>
    </div>

    <h1>Book A <span>Appointment</span></h1>

    <p class="subtitle">
        Schedule your appointment with ease ✨
    </p>

    <form id="bookapp">

        <label>
            <i class="fa-solid fa-user"></i>
            Name
        </label>
        <input type="text" id="username">

        <label>
            <i class="fa-solid fa-envelope"></i>
            Email
        </label>
        <input type="email" id="email">

        <label>
            <i class="fa-solid fa-phone"></i>
            Phone
        </label>
        <input type="number" id="phone">

        <button type="submit">
            <i class="fa-solid fa-paper-plane"></i>
            Submit Appointment
        </button>

    </form>

    <div class="appointments-title">
        These are the appointments:
    </div>

    <ul id="appointments"></ul>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.21.1/axios.min.js"></script>
<script>
    
    const form =document.getElementById('bookapp')
    const appointments=document.getElementById('appointments');
    form.addEventListener('submit',(event)=>{
        event.preventDefault();
        const name=document.getElementById('username').value;
        const email=document.getElementById('email').value;
        const phone=document.getElementById('phone').value;
        let myobj={
            username:name,
            useremail:email,
            userphone:phone
        }
        document.getElementById('username').value='';
        document.getElementById('email').value='';
        document.getElementById('phone').value='';
        axios.post('http://localhost:8000/book',myobj)
        .then(result=>{
            console.log(result)
            fetchDeatils()
        }).catch(err=>{
            console.log('not able to sent to post request ')
        })
    })
    function fetchDeatils(){
        axios.get('http://localhost:8000/bookings').then(res=>{
            console.log('in get ')
            display(res.data)
        }).catch(err=>{
            console.log("not able to send get request ")
        })
    }
    function display(obj){
        const ul=document.getElementById('appointments')
        ul.innerHTML=""
        obj.forEach(myobj => {
            const deletebtn=document.createElement('button');
            deletebtn.textContent="Delete"
            const editbtn=document.createElement('button');
            editbtn.textContent="Edit"
            const li=document.createElement('li');
            li.innerHTML=`-${myobj.name}-${myobj.email}-${myobj.phone}`;
            li.appendChild(deletebtn);
            li.appendChild(editbtn);
            ul.appendChild(li)
            deletebtn.addEventListener("click",()=>{
                Delete(myobj.id)
            })
            editbtn.addEventListener('click',()=>{
                Edit(myobj)
            })
        });
        function Delete(id){
            axios.delete(`http://localhost:8000/bookings/${id}`).then(result=>{
                console.log(result)
                fetchDeatils()
            }
            ).catch(err=>{
                console.log(err)
            })
        }
        function Edit(myobj){
            document.getElementById('username').value=myobj.name;
            document.getElementById('email').value=myobj.email;
            document.getElementById('phone').value=myobj.phone;
            const id=myobj.id
            axios.delete(`http://localhost:8000/bookings/${id}`).then(result=>{
                console.log(result)
                fetchDeatils()
            }
            ).catch(err=>{
                console.log(err)
            })
        }
        
        //console.log(myobj)
    }
    
    
</script>

</body>
</html>
